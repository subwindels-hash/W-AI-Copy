<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1525" />
    <meta name="description" content="WINDELS AI OS — the intelligent operating system for work." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:image" content="/og/og-image.png" />
    <meta property="og:title" content="WINDELS AI OS — Enterprise AI Workforce" />
    <meta property="og:description" content="Build, deploy, and govern AI agents across your organization." />

    <!-- Apple / iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WINDELS" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <title>WINDELS AI OS</title>
  </head>
  <body class="bg-bg-deep text-text-main antialiased">
    <div id="boot-splash" style="position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0A0F1A;color:#E2E8F0;font-family:Inter,system-ui,sans-serif;transition:opacity .4s ease">
      <div style="position:absolute;inset:0;background:radial-gradient(800px 400px at 50% 30%, rgba(59,130,246,.15), transparent 60%), radial-gradient(600px 400px at 70% 70%, rgba(139,92,246,.1), transparent 60%)"></div>
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:18px">
        <img src="/brand/logo-icon.png" alt="WINDELS" style="width:88px;height:88px;border-radius:20px;object-fit:cover;box-shadow:0 0 40px rgba(59,130,246,.45)" />
        <div style="text-align:center"><div style="font-weight:800;letter-spacing:.18em;font-size:16px;color:#fff">WINDELS</div><div style="font-size:10px;letter-spacing:.35em;color:#6B7FA0;margin-top:2px">AI OS</div></div>
        <div style="width:140px;height:3px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden"><div style="height:100%;width:50%;background:linear-gradient(90deg,#3B82F6,#8B5CF6);animation:bootfill 1.4s ease-in-out infinite"></div></div>
        <div style="font-size:10px;letter-spacing:.25em;color:#6B7FA0">BOOTING…</div>
      </div>
    </div>
    <style>@keyframes bootfill{0%{transform:translateX(-100%)}50%{transform:translateX(50%)}100%{transform:translateX(180%)}}</style>
    <script>addEventListener('load',()=>setTimeout(()=>{const s=document.getElementById('boot-splash');if(s){s.style.opacity='0';setTimeout(()=>s.remove(),450)}},900))</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register service worker for PWA/offline/push (Session 15)
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => { /* SW optional in dev */ });
        });
      }
    </script>
  </body>
</html>
