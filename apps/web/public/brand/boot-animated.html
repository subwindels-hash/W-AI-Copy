<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WINDELS AI OS — Booting</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%;background:#0A0F1A;color:#E2E8F0;font-family:Inter,system-ui,sans-serif;overflow:hidden}
.screen{height:100%;display:grid;place-items:center;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(800px 400px at 50% 40%, rgba(59,130,246,.18), transparent 60%), radial-gradient(600px 400px at 70% 70%, rgba(139,92,246,.12), transparent 60%)}
.logo-wrap{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{width:112px;height:112px;border-radius:24px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);display:grid;place-items:center;font-weight:900;font-size:56px;color:#fff;box-shadow:0 10px 40px rgba(59,130,246,.45), 0 0 80px rgba(139,92,246,.3);animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 10px 40px rgba(59,130,246,.45)}50%{transform:scale(1.04);box-shadow:0 14px 50px rgba(59,130,246,.6)}}
.wordmark{letter-spacing:.14em;font-weight:800;font-size:22px}
.wordmark span{font-weight:300;opacity:.7;letter-spacing:.35em;font-size:10px;display:block;text-align:center;margin-top:4px;color:#6B7FA0}
.bar{width:220px;height:3px;background:rgba(255,255,255,.08);border-radius:999px;overflow:hidden;margin-top:8px}
.fill{height:100%;width:45%;background:linear-gradient(90deg,#3B82F6,#8B5CF6);border-radius:999px;animation:load 1.6s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}50%{transform:translateX(80%)}100%{transform:translateX(220%)}}
.dots{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.2em;color:#6B7FA0;animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:.6}50%{opacity:1}}
</style></head><body><div class="screen"><div class="bg"></div><div class="logo-wrap"><div class="logo">W</div><div class="wordmark">WINDELS<span>AI OS — BOOTING</span></div><div class="bar"><div class="fill"></div></div></div><div class="dots">INITIALIZING WORKFORCE ● SECURE KERNEL ● GOVERNANCE</div></div></body></html>
