services:
  mysql:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: ${DB_NAME:-windels}
      MARIADB_USER: ${DB_USER:-windels}
      MARIADB_PASSWORD: ${DB_PASSWORD:-windels}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-root-password}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./php/application/migrations/001_initial_mysql.sql:/docker-entrypoint-initdb.d/001_initial_mysql.sql:ro
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./php
    environment:
      CI_ENV: development
      DB_HOST: mysql
      DB_NAME: ${DB_NAME:-windels}
      DB_USER: ${DB_USER:-windels}
      DB_PASSWORD: ${DB_PASSWORD:-windels}
      JWT_SECRET: ${JWT_SECRET:-development-only-secret-change-me-now}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports: ["4000:80"]
    depends_on:
      mysql: { condition: service_healthy }
  web:
    image: node:20-alpine
    working_dir: /workspace
    command: sh -c "corepack enable && pnpm --filter @windels/web dev --host 0.0.0.0"
    environment:
      VITE_API_URL: /api/v1
    volumes: [".:/workspace"]
    ports: ["5173:5173"]
volumes:
  mysql_data:
