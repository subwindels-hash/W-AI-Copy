# ── Horizontal Pod Autoscaler (requires metrics-server) ────────────────────
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: windels-api
  namespace: windels
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: windels-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
    - type: Resource
      resource: { name: memory, target: { type: Utilization, averageUtilization: 75 } }
  behavior:
    scaleUp: { stabilizationWindowSeconds: 30 }
    scaleDown: { stabilizationWindowSeconds: 300 }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: windels-web
  namespace: windels
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: windels-web
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
