# ── API Deployment + Service ────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: windels-api
  namespace: windels
  labels: { app: windels-api }
spec:
  replicas: 2
  selector: { matchLabels: { app: windels-api } }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: windels-api }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/windels-ai/windels:latest
          ports: [{ containerPort: 4000, name: http }]
          envFrom:
            - configMapRef: { name: windels-config }
            - secretRef: { name: windels-secrets }
          env:
            - name: GIT_COMMIT
              valueFrom:
                fieldRef: { fieldPath: metadata.annotations['git/commit'] }
          readinessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: { path: /api/v1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests: { cpu: "100m", memory: "384Mi" }
            limits: { cpu: "1500m", memory: "1536Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: windels-api
  namespace: windels
  labels: { app: windels-api }
spec:
  type: ClusterIP
  ports: [{ port: 4000, targetPort: http, name: http }]
  selector: { app: windels-api }
