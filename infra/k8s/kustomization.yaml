apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: windels

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - api-deployment.yaml
  - web-deployment.yaml
  - api-hpa.yaml
  - ingress.yaml

images:
  - name: ghcr.io/windels-ai/windels
    newTag: latest
  - name: ghcr.io/windels-ai/windels-web
    newTag: latest

commonLabels:
  app.kubernetes.io/name: windels-ai-os
  app.kubernetes.io/managed-by: kustomize
