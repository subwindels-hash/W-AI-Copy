# ── Prometheus config ──────────────────────────────────────────────────────
# Scrapes the API /metrics endpoint plus node_exporter (if present).
# Use with infra/monitoring/docker-compose.monitoring.yml, or load into a
# k8s Prometheus (kube-prometheus-stack) via additionalScrapeConfigs.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: windels-ai-os

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: windels-api
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["api:4000"]
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: windels-api-direct
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:4000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
